name: RAM PLAYER v23.3 Single TV & Mobile Release APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ram-player-v233-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print | sort -V | tail -n 1)"
          if [[ -n "${ZIP_FILE}" ]]; then
            echo "Found source archive: ${ZIP_FILE}"
            EXTRACT_DIR="${RUNNER_TEMP}/ram-player-source"
            rm -rf "${EXTRACT_DIR}"
            mkdir -p "${EXTRACT_DIR}"
            unzip -q -o "${ZIP_FILE}" -d "${EXTRACT_DIR}"
            SETTINGS_FILE="$(find "${EXTRACT_DIR}" -type f -name settings.gradle.kts -print -quit)"
            if [[ -z "${SETTINGS_FILE}" ]]; then
              echo "::error::ZIP does not contain settings.gradle.kts."
              exit 1
            fi
            PROJECT_DIR="$(dirname "${SETTINGS_FILE}")"
            test -f "${PROJECT_DIR}/app/build.gradle.kts"
            cp -a "${PROJECT_DIR}/." "${GITHUB_WORKSPACE}/"
            test -f settings.gradle.kts
            test -f app/build.gradle.kts
          elif [[ -f "settings.gradle.kts" && -f "app/build.gradle.kts" ]]; then
            echo "Android project found directly at repository root."
          else
            echo "::error::No source project or ZIP found."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK and install SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="${SDK_ROOT}"
          export ANDROID_SDK_ROOT="${SDK_ROOT}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "sdk.dir=${SDK_ROOT}" > local.properties
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null || true
          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configure optional persistent APK signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64}" && -n "${KEYSTORE_PASSWORD}" && -n "${KEY_ALIAS}" && -n "${KEY_PASSWORD}" ]]; then
            KEYSTORE_PATH="${RUNNER_TEMP}/ram-player-release.jks"
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
            test -s "${KEYSTORE_PATH}"
            printf 'SIGNING_STORE_FILE=%s\nSIGNING_STORE_PASSWORD=%s\nSIGNING_KEY_ALIAS=%s\nSIGNING_KEY_PASSWORD=%s\n' "${KEYSTORE_PATH}" "${KEYSTORE_PASSWORD}" "${KEY_ALIAS}" "${KEY_PASSWORD}" >> "${GITHUB_ENV}"
          fi

      - name: Verify project & run TV + Mobile unit tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "scripts/verify_project.py" ]]; then
            python3 scripts/verify_project.py
          fi
          gradle --no-daemon --no-configuration-cache testTvDebugUnitTest testMobileDebugUnitTest --console=plain

      - name: Build Single TV Release APK (44MB) & Single Mobile Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache assembleTvRelease assembleMobileRelease --console=plain
          mkdir -p single_tv_out single_mobile_out

          TV_APK="$(find app/build/outputs/apk/tv/release -maxdepth 2 -type f -name '*armeabi-v7a*.apk' ! -name '*-unsigned.apk' -print -quit)"
          if [[ -z "${TV_APK}" ]]; then
            TV_APK="$(find app/build/outputs/apk/tv/release -maxdepth 2 -type f -name '*.apk' ! -name '*-unsigned.apk' -print -quit)"
          fi
          test -s "${TV_APK}"
          unzip -t "${TV_APK}" >/dev/null
          cp "${TV_APK}" single_tv_out/RAM-PLAYER-v23.3-TV-Release.apk

          MOBILE_APK="$(find app/build/outputs/apk/mobile/release -maxdepth 2 -type f -name '*arm64-v8a*.apk' ! -name '*-unsigned.apk' -print -quit)"
          if [[ -z "${MOBILE_APK}" ]]; then
            MOBILE_APK="$(find app/build/outputs/apk/mobile/release -maxdepth 2 -type f -name '*.apk' ! -name '*-unsigned.apk' -print -quit)"
          fi
          test -s "${MOBILE_APK}"
          unzip -t "${MOBILE_APK}" >/dev/null
          cp "${MOBILE_APK}" single_mobile_out/RAM-PLAYER-v23.3-Mobile-Release.apk

          ls -lh single_tv_out/ single_mobile_out/

      - name: Upload Single TV Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RAM-PLAYER-v23.3-TV-Single-Release-APK
          path: single_tv_out/RAM-PLAYER-v23.3-TV-Release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Single Mobile Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RAM-PLAYER-v23.3-Mobile-Single-Release-APK
          path: single_mobile_out/RAM-PLAYER-v23.3-Mobile-Release.apk
          if-no-files-found: error
          retention-days: 14
          
